name: Release EF Planner — macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-beta-macos"
      - "v*-beta-macos.*"

jobs:
  build:
    permissions:
      contents: write

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Restore Tauri updater private key
        env:
          KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          KEY_PATH: ${{ runner.temp }}/ef-planner-updater.key
        run: |
          node -e "const fs = require('fs'); fs.writeFileSync(process.env.KEY_PATH, Buffer.from(process.env.KEY_B64, 'base64'));"

      - name: Protect updater private key
        run: chmod 600 "${{ runner.temp }}/ef-planner-updater.key"

      - name: Build macOS release with explicit configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/ef-planner-updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          pnpm tauri build \
            --target aarch64-apple-darwin \
            --config src-tauri/tauri.macos.release.conf.json \
            --verbose

      - name: Verify macOS release artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "Relevant macOS artifacts:"

          find src-tauri/target \
            -type f \
            \( \
              -name '*.dmg' \
              -o -name '*.app.tar.gz' \
              -o -name '*.app.tar.gz.sig' \
            \) \
            -print

          DMG="$(find src-tauri/target -type f -name '*.dmg' -print -quit)"
          ARCHIVE="$(find src-tauri/target -type f -name '*.app.tar.gz' -print -quit)"

          if [ -z "${DMG}" ] || [ ! -f "${DMG}" ]; then
            echo "ERROR: macOS DMG was not generated."
            exit 1
          fi

          if [ -z "${ARCHIVE}" ] || [ ! -f "${ARCHIVE}" ]; then
            echo "ERROR: macOS updater archive was not generated."
            echo "Explicit configuration used:"
            cat src-tauri/tauri.macos.release.conf.json
            exit 1
          fi

          SIGNATURE="${ARCHIVE}.sig"

          if [ ! -f "${SIGNATURE}" ]; then
            echo "ERROR: macOS updater signature was not generated."
            echo "Expected signature: ${SIGNATURE}"
            exit 1
          fi

          echo "DMG found: ${DMG}"
          echo "Updater archive found: ${ARCHIVE}"
          echo "Updater signature found: ${SIGNATURE}"

      - name: Prepare macOS release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p updater-macos

          DMG="$(find src-tauri/target -type f -name '*.dmg' -print -quit)"
          ARCHIVE="$(find src-tauri/target -type f -name '*.app.tar.gz' -print -quit)"
          SIGNATURE="${ARCHIVE}.sig"

          cp "${DMG}" \
            "updater-macos/EF.Planner_1.4.1_aarch64.dmg"

          cp "${ARCHIVE}" \
            "updater-macos/EF.Planner_aarch64.app.tar.gz"

          cp "${SIGNATURE}" \
            "updater-macos/EF.Planner_aarch64.app.tar.gz.sig"

          test -s "updater-macos/EF.Planner_1.4.1_aarch64.dmg"
          test -s "updater-macos/EF.Planner_aarch64.app.tar.gz"
          test -s "updater-macos/EF.Planner_aarch64.app.tar.gz.sig"

      - name: Create macOS latest.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const config = JSON.parse(
            fs.readFileSync(
              "src-tauri/tauri.conf.json",
              "utf8"
            )
          );

          const signature = fs
            .readFileSync(
              "updater-macos/EF.Planner_aarch64.app.tar.gz.sig",
              "utf8"
            )
            .trim();

          const repository = process.env.GITHUB_REPOSITORY;
          const tag = process.env.GITHUB_REF_NAME;

          if (config.version !== "1.4.1") {
            throw new Error(
              `Expected version 1.4.1 but found ${config.version}`
            );
          }

          if (!signature) {
            throw new Error("macOS signature is empty");
          }

          if (!repository || !tag) {
            throw new Error(
              "GitHub repository or tag environment is missing"
            );
          }

          const filename =
            "EF.Planner_aarch64.app.tar.gz";

          const url =
            `https://github.com/${repository}/releases/download/` +
            `${encodeURIComponent(tag)}/` +
            `${encodeURIComponent(filename)}`;

          const entry = {
            signature,
            url
          };

          const latest = {
            version: "1.4.1",
            notes: "Versión beta 1.4.1 de EF Planner para macOS.",
            pub_date: new Date().toISOString(),
            platforms: {
              "darwin-aarch64": entry,
              "darwin-aarch64-app": entry
            }
          };

          fs.writeFileSync(
            "updater-macos/latest.json",
            JSON.stringify(latest, null, 2) + "\n",
            "utf8"
          );

          console.log("macOS updater version:", latest.version);
          console.log(
            "macOS updater platforms:",
            Object.keys(latest.platforms).join(", ")
          );
          NODE

      - name: Validate macOS latest.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const path = "updater-macos/latest.json";

          if (!fs.existsSync(path)) {
            throw new Error("updater-macos/latest.json does not exist");
          }

          const latest = JSON.parse(fs.readFileSync(path, "utf8"));

          if (!latest.version) throw new Error("latest.json does not contain version");
          if (!latest.platforms) throw new Error("latest.json does not contain platforms");

          const required = ["darwin-aarch64", "darwin-aarch64-app"];

          for (const platform of required) {
            const entry = latest.platforms[platform];
            if (!entry) throw new Error(`Missing platform: ${platform}`);
            if (!entry.url) throw new Error(`Platform ${platform} missing url`);
            if (!entry.signature) throw new Error(`Platform ${platform} missing signature`);
            if (!entry.url.includes("EF.Planner_aarch64.app.tar.gz")) throw new Error(`Unexpected URL for ${platform}`);
          }

          console.log("latest.json validation completed.");
          console.log("Version:", latest.version);
          console.log("Platforms:", Object.keys(latest.platforms).join(", "));
          NODE

      - name: Ensure macOS version release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "EF Planner ${GITHUB_REF_NAME}" \
            --prerelease \
            --notes "Versión beta 1.4.1 de EF Planner para macOS."

      - name: Upload macOS assets to version release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "updater-macos/EF.Planner_1.4.1_aarch64.dmg" \
            "updater-macos/EF.Planner_aarch64.app.tar.gz" \
            "updater-macos/EF.Planner_aarch64.app.tar.gz.sig" \
            "updater-macos/latest.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Ensure updater-macos-beta release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view updater-macos-beta \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
          gh release create updater-macos-beta \
            --repo "${GITHUB_REPOSITORY}" \
            --target main \
            --title "EF Planner macOS Beta Updater Channel" \
            --prerelease \
            --notes "Canal permanente de actualizaciones beta para macOS."

      - name: Upload latest.json to updater-macos-beta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload updater-macos-beta \
            "updater-macos/latest.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
