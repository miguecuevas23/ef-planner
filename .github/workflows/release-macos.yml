name: Release EF Planner — macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-beta-macos"
      - "v*-beta-macos.*"

jobs:
  build:
    permissions:
      contents: write

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Restore Tauri updater private key
        env:
          KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          KEY_PATH: ${{ runner.temp }}/ef-planner-updater.key
        run: |
          node -e "const fs = require('fs'); fs.writeFileSync(process.env.KEY_PATH, Buffer.from(process.env.KEY_B64, 'base64'));"

      - name: Protect updater private key
        run: chmod 600 "${{ runner.temp }}/ef-planner-updater.key"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/ef-planner-updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EF Planner ${{ github.ref_name }}"
          releaseBody: "Versión beta de EF Planner para macOS."
          releaseDraft: false
          prerelease: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          retryAttempts: 2
          args: --target aarch64-apple-darwin

      - name: Verify macOS updater artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "Bundle files generated by Tauri:"
          find src-tauri/target \
            -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
            -print

          ARCHIVE="$(find src-tauri/target -type f -name '*.app.tar.gz' -print -quit)"

          if [ -z "${ARCHIVE}" ]; then
            echo "ERROR: Tauri did not generate the macOS updater archive."
            echo "Confirm bundle.createUpdaterArtifacts=true in the merged macOS configuration."
            exit 1
          fi

          SIGNATURE_FILE="${ARCHIVE}.sig"

          if [ ! -f "${SIGNATURE_FILE}" ]; then
            echo "ERROR: Tauri generated the updater archive but not its signature:"
            echo "${SIGNATURE_FILE}"
            exit 1
          fi

          echo "macOS updater archive found:"
          echo "${ARCHIVE}"
          echo "macOS updater signature found:"
          echo "${SIGNATURE_FILE}"

      - name: Prepare macOS updater assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p updater-macos

          ARCHIVE="$(find src-tauri/target -type f -name '*.app.tar.gz' -print -quit)"

          if [ -z "${ARCHIVE}" ] || [ ! -f "${ARCHIVE}" ]; then
            echo "macOS updater archive .app.tar.gz was not found"
            echo "Files generated inside target:"
            find src-tauri/target -maxdepth 10 -type f -print
            exit 1
          fi

          SIGNATURE_FILE="${ARCHIVE}.sig"

          if [ ! -f "${SIGNATURE_FILE}" ]; then
            echo "macOS updater signature was not found: ${SIGNATURE_FILE}"
            exit 1
          fi

          cp "${ARCHIVE}" "updater-macos/EF.Planner_aarch64.app.tar.gz"
          cp "${SIGNATURE_FILE}" "updater-macos/EF.Planner_aarch64.app.tar.gz.sig"

          test -s "updater-macos/EF.Planner_aarch64.app.tar.gz"
          test -s "updater-macos/EF.Planner_aarch64.app.tar.gz.sig"

          echo "macOS updater archive prepared."
          echo "Archive source: ${ARCHIVE}"

      - name: Create macOS latest.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const configPath = "src-tauri/tauri.conf.json";
          const signaturePath =
            "updater-macos/EF.Planner_aarch64.app.tar.gz.sig";
          const outputPath = "updater-macos/latest.json";

          const config = JSON.parse(
            fs.readFileSync(configPath, "utf8")
          );

          const signature = fs
            .readFileSync(signaturePath, "utf8")
            .trim();

          const repository = process.env.GITHUB_REPOSITORY;
          const tag = process.env.GITHUB_REF_NAME;

          if (!config.version) {
            throw new Error(
              "App version is missing from src-tauri/tauri.conf.json"
            );
          }

          if (!signature) {
            throw new Error(
              "macOS updater signature is empty"
            );
          }

          if (!repository) {
            throw new Error(
              "GITHUB_REPOSITORY environment variable is missing"
            );
          }

          if (!tag) {
            throw new Error(
              "GITHUB_REF_NAME environment variable is missing"
            );
          }

          const archiveName =
            "EF.Planner_aarch64.app.tar.gz";

          const encodedTag = encodeURIComponent(tag);
          const encodedArchive = encodeURIComponent(archiveName);

          const url =
            `https://github.com/${repository}/releases/download/` +
            `${encodedTag}/${encodedArchive}`;

          const updaterEntry = {
            signature,
            url
          };

          const latest = {
            version: config.version,
            notes: "Versión beta de EF Planner para macOS.",
            pub_date: new Date().toISOString(),
            platforms: {
              "darwin-aarch64": updaterEntry,
              "darwin-aarch64-app": updaterEntry
            }
          };

          fs.writeFileSync(
            outputPath,
            JSON.stringify(latest, null, 2) + "\n",
            "utf8"
          );

          console.log("Updater version:", latest.version);
          console.log(
            "Updater platforms:",
            Object.keys(latest.platforms).join(", ")
          );
          console.log("Updater package:", archiveName);
          NODE

      - name: Validate macOS latest.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const path = "updater-macos/latest.json";

          if (!fs.existsSync(path)) {
            throw new Error(
              "updater-macos/latest.json does not exist"
            );
          }

          const latest = JSON.parse(
            fs.readFileSync(path, "utf8")
          );

          if (!latest.version) {
            throw new Error(
              "latest.json does not contain version"
            );
          }

          if (!latest.platforms) {
            throw new Error(
              "latest.json does not contain platforms"
            );
          }

          const requiredPlatforms = [
            "darwin-aarch64",
            "darwin-aarch64-app"
          ];

          for (const platform of requiredPlatforms) {
            const entry = latest.platforms[platform];

            if (!entry) {
              throw new Error(
                `Missing macOS updater platform: ${platform}`
              );
            }

            if (!entry.url) {
              throw new Error(
                `Platform ${platform} does not contain url`
              );
            }

            if (!entry.signature) {
              throw new Error(
                `Platform ${platform} does not contain signature`
              );
            }

            if (
              !entry.url.includes(
                "EF.Planner_aarch64.app.tar.gz"
              )
            ) {
              throw new Error(
                `Unexpected updater URL for ${platform}`
              );
            }
          }

          console.log(
            "macOS latest.json validation completed."
          );
          console.log("Version:", latest.version);
          console.log(
            "Platforms:",
            Object.keys(latest.platforms).join(", ")
          );
          NODE

      - name: Upload macOS updater assets to version release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "updater-macos/EF.Planner_aarch64.app.tar.gz" \
            "updater-macos/EF.Planner_aarch64.app.tar.gz.sig" \
            "updater-macos/latest.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Ensure updater-macos-beta release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view updater-macos-beta \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
          gh release create updater-macos-beta \
            --repo "${GITHUB_REPOSITORY}" \
            --target main \
            --title "EF Planner macOS Beta Updater Channel" \
            --prerelease \
            --notes "Canal permanente de actualizaciones beta de EF Planner para macOS."

      - name: Upload latest.json to updater-macos-beta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload updater-macos-beta \
            "updater-macos/latest.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
