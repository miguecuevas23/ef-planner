name: Release EF Planner

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundler: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundler: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bundler: appimage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Tauri updater private key
        env:
          KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          KEY_PATH: ${{ runner.temp }}/ef-planner-updater.key
        run: |
          node -e "const fs = require('fs'); fs.writeFileSync(process.env.KEY_PATH, Buffer.from(process.env.KEY_B64, 'base64'));"

      - name: Protect updater private key
        if: runner.os != 'Windows'
        run: chmod 600 "${{ runner.temp }}/ef-planner-updater.key"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/ef-planner-updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EF Planner ${{ github.ref_name }}"
          releaseBody: "Versión beta multiplataforma de EF Planner."
          releaseDraft: false
          prerelease: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: --target ${{ matrix.target }}

      - name: Capture platform updater JSON
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force "platform-json" | Out-Null

          gh release download "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --pattern "latest.json" `
            --dir "platform-json" `
            --clobber

          if (-not (Test-Path "platform-json/latest.json")) {
            throw "latest.json was not found after build for ${{ matrix.platform }}"
          }

          Copy-Item `
            "platform-json/latest.json" `
            "platform-json/latest-${{ matrix.platform }}.json"

      - name: Upload platform updater JSON
        uses: actions/upload-artifact@v4
        with:
          name: updater-json-${{ matrix.platform }}
          path: platform-json/latest-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 5

  publish-updater:
    name: Publish updater channel
    needs: build
    if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download platform updater JSONs
        uses: actions/download-artifact@v4
        with:
          pattern: updater-json-*
          path: updater-jsons
          merge-multiple: true

      - name: List platform JSONs
        shell: bash
        run: |
          echo "Platform JSON files:"
          find updater-jsons -maxdepth 2 -type f -name "*.json" -print

      - name: Merge platform JSONs into latest.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            const inputDir = 'updater-jsons';
            const outputDir = 'updater-channel';

            fs.mkdirSync(outputDir, { recursive: true });

            let files = [];
            function walk(d) {
              for (const entry of fs.readdirSync(d, { withFileTypes: true })) {
                const fp = path.join(d, entry.name);
                if (entry.isDirectory()) walk(fp);
                else if (entry.name.endsWith('.json')) files.push(fp);
              }
            }
            walk(inputDir);

            if (files.length < 3) {
              throw new Error('Expected at least 3 platform JSON files, found ' + files.length);
            }

            const documents = files.map((file) => {
              const content = fs.readFileSync(file, 'utf8');
              return JSON.parse(content);
            });

            const versions = [...new Set(documents.map((doc) => doc.version))];
            if (versions.length !== 1) {
              throw new Error('Platform JSON versions do not match: ' + versions.join(', '));
            }

            const merged = {
              version: documents[0].version,
              notes: documents[0].notes ?? '',
              pub_date: documents[0].pub_date,
              platforms: {}
            };

            for (const document of documents) {
              if (!document.platforms || typeof document.platforms !== 'object') {
                throw new Error('A platform JSON does not contain platforms');
              }
              Object.assign(merged.platforms, document.platforms);
            }

            if (!merged.platforms['darwin-aarch64'] && merged.platforms['darwin-aarch64-app']) {
              merged.platforms['darwin-aarch64'] = merged.platforms['darwin-aarch64-app'];
            }
            if (!merged.platforms['windows-x86_64'] && merged.platforms['windows-x86_64-nsis']) {
              merged.platforms['windows-x86_64'] = merged.platforms['windows-x86_64-nsis'];
            }
            if (!merged.platforms['linux-x86_64'] && merged.platforms['linux-x86_64-appimage']) {
              merged.platforms['linux-x86_64'] = merged.platforms['linux-x86_64-appimage'];
            }

            const requiredPlatforms = ['darwin-aarch64', 'windows-x86_64', 'linux-x86_64'];
            for (const platform of requiredPlatforms) {
              const entry = merged.platforms[platform];
              if (!entry) {
                throw new Error('Missing updater platform: ' + platform);
              }
              if (!entry.url || !entry.signature) {
                throw new Error('Updater platform ' + platform + ' is missing url or signature');
              }
            }

            fs.writeFileSync(
              'updater-channel/latest.json',
              JSON.stringify(merged, null, 2) + '\n',
              'utf8'
            );

            console.log('Updater version:', merged.version);
            console.log('Updater platforms:', Object.keys(merged.platforms).sort().join(', '));
          "

      - name: Ensure updater-beta release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view updater-beta \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
          gh release create updater-beta \
            --repo "${GITHUB_REPOSITORY}" \
            --target main \
            --title "EF Planner Beta Updater Channel" \
            --prerelease \
            --notes "Canal permanente de actualizaciones beta de EF Planner."

      - name: Upload latest.json to updater-beta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload updater-beta \
            updater-channel/latest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
