name: Release EF Planner

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundler: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundler: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bundler: appimage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Tauri updater private key
        env:
          KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          KEY_PATH: ${{ runner.temp }}/ef-planner-updater.key
        run: |
          node -e "const fs = require('fs'); fs.writeFileSync(process.env.KEY_PATH, Buffer.from(process.env.KEY_B64, 'base64'));"

      - name: Protect updater private key
        if: runner.os != 'Windows'
        run: chmod 600 "${{ runner.temp }}/ef-planner-updater.key"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/ef-planner-updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EF Planner ${{ github.ref_name }}"
          releaseBody: "Versión beta multiplataforma de EF Planner."
          releaseDraft: false
          prerelease: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: --target ${{ matrix.target }}

  publish-updater:
    name: Publish updater channel
    needs: build
    if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download generated latest.json from tag release
        shell: bash
        run: |
          mkdir -p updater-channel
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "latest.json" \
            --dir updater-channel
          test -s updater-channel/latest.json
          echo "Downloaded latest.json ($(wc -c < updater-channel/latest.json) bytes)"

      - name: Validate platforms in latest.json
        shell: bash
        run: |
          echo "=== Platforms found ==="
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('updater-channel/latest.json', 'utf8'));
            console.log('Version:', data.version);
            const platforms = data.platforms || {};
            const names = Object.keys(platforms);
            console.log('Platforms (' + names.length + '):', names.join(', '));

            const required = ['darwin-aarch64', 'windows-x86_64', 'linux-x86_64'];
            const missing = required.filter(p => !names.includes(p));
            if (missing.length > 0) {
              console.error('MISSING platforms:', missing.join(', '));
              process.exit(1);
            }

            for (const name of names) {
              const p = platforms[name];
              if (!p.url)  { console.error(name + ': missing url');  process.exit(1); }
              if (!p.signature) { console.error(name + ': missing signature'); process.exit(1); }
              console.log('  OK ' + name + ' — url + signature present');
            }
            console.log('All platforms validated.');
          "

      - name: Ensure updater-beta release exists
        shell: bash
        run: |
          gh release view updater-beta \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
          gh release create updater-beta \
            --repo "${GITHUB_REPOSITORY}" \
            --target main \
            --title "EF Planner Beta Updater Channel" \
            --prerelease \
            --notes "Canal permanente de actualizaciones beta de EF Planner."

      - name: Upload latest.json to updater-beta
        shell: bash
        run: |
          gh release upload updater-beta \
            updater-channel/latest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
