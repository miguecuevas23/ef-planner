name: Release EF Planner

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release-macos:
    permissions:
      contents: write

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Restore Tauri updater private key
        run: |
          mkdir -p "$HOME/.tauri"
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}" | base64 -D > "$HOME/.tauri/ef-planner-updater.key"
          chmod 600 "$HOME/.tauri/ef-planner-updater.key"

          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<__TAURI_PRIVATE_KEY__"
            cat "$HOME/.tauri/ef-planner-updater.key"
            printf '\n__TAURI_PRIVATE_KEY__\n'
          } >> "$GITHUB_ENV"

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EF Planner ${{ github.ref_name }}"
          releaseBody: "Versión beta de EF Planner para testers."
          prerelease: true
          releaseDraft: false
          args: --target aarch64-apple-darwin
