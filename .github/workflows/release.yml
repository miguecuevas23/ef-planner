name: Release EF Planner

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundler: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundler: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bundler: appimage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Tauri updater private key
        env:
          KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          KEY_PATH: ${{ runner.temp }}/ef-planner-updater.key
        run: |
          node -e "const fs = require('fs'); fs.writeFileSync(process.env.KEY_PATH, Buffer.from(process.env.KEY_B64, 'base64'));"

      - name: Protect updater private key
        if: runner.os != 'Windows'
        run: chmod 600 "${{ runner.temp }}/ef-planner-updater.key"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/ef-planner-updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EF Planner ${{ github.ref_name }}"
          releaseBody: "Versión beta de EF Planner para testers."
          prerelease: true
          releaseDraft: false
          args: --target ${{ matrix.target }}

      - name: Upload updater JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-json-${{ matrix.platform }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/

  publish-updater:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all updater JSONs
        uses: actions/download-artifact@v4
        with:
          pattern: updater-json-*
          merge-multiple: true
          path: updater-artifacts

      - name: Merge updater JSONs and upload to updater-beta
        shell: bash
        run: |
          set -e

          echo "=== Available artifacts ==="
          find updater-artifacts -type f | sort

          # Find the latest.json or .json files generated by each platform build
          # Tauri v2 generates a JSON per platform with signature info
          # We merge them into one multiplatform latest.json

          node -e "
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            const dir = 'updater-artifacts';
            const platforms = {};

            function walk(d) {
              const entries = fs.readdirSync(d, { withFileTypes: true });
              for (const e of entries) {
                const full = path.join(d, e.name);
                if (e.isDirectory()) walk(full);
                else if (e.name.endsWith('.json') && e.name !== 'latest.json') {
                  try {
                    const data = JSON.parse(fs.readFileSync(full, 'utf8'));
                    if (data.platforms) {
                      Object.assign(platforms, data.platforms);
                    }
                    if (data.version) {
                      platforms._version = data.version;
                      platforms._notes = data.notes || '';
                      platforms._pub_date = data.pub_date || new Date().toISOString();
                    }
                  } catch (err) {
                    console.error('Skipping', full, err.message);
                  }
                } else if (e.name === 'latest.json') {
                  try {
                    const data = JSON.parse(fs.readFileSync(full, 'utf8'));
                    if (data.platforms) {
                      Object.assign(platforms, data.platforms);
                    }
                  } catch (err) {
                    console.error('Skipping latest.json:', err.message);
                  }
                }
              }
            }
            walk(dir);

            // Build merged latest.json
            const merged = {
              version: platforms._version || '${{ github.ref_name }}'.replace(/^v/, ''),
              notes: platforms._notes || 'Versión beta de EF Planner.',
              pub_date: platforms._pub_date || new Date().toISOString(),
              platforms: {}
            };
            delete platforms._version;
            delete platforms._notes;
            delete platforms._pub_date;
            merged.platforms = platforms;

            const platformCount = Object.keys(merged.platforms).length;
            console.log('Merged platforms:', Object.keys(merged.platforms).join(', '));

            if (platformCount === 0) {
              // Fallback: create platform JSONs from release assets
              console.log('No platform JSONs found in artifacts. Check CI logs.');
              process.exit(1);
            }

            fs.writeFileSync('latest.json', JSON.stringify(merged, null, 2));
            console.log('Written latest.json with', platformCount, 'platform(s)');
          "

          echo "=== Merged latest.json ==="
          cat latest.json

      - name: Upload latest.json to updater-beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: updater-beta
          files: latest.json
          prerelease: true
          body: "Canal beta de actualizaciones de EF Planner. No modificar manualmente."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
